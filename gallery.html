<!-- Content -->
<section>

    <header class="main">
        <h1>Memories & Albums</h1>
        <p>
            Conferences, collaborations, travel,
            research life, and unforgettable moments.
        </p>
    </header>

    <!-- =========================
         CUSTOM STYLE
    ========================== -->

    <style>

    .album-grid{
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
        gap:30px;
        margin-top:40px;
    }

    .album-card{
        position:relative;
        overflow:hidden;
        border-radius:12px;
        cursor:pointer;
        height:300px;
        transition:0.4s ease;
        box-shadow:0 8px 20px rgba(0,0,0,0.15);
    }

    .album-card img{
        width:100%;
        height:100%;
        object-fit:cover;
        transition:0.6s ease;
    }

    .album-card:hover img{
        transform:scale(1.08);
    }

    .album-overlay{
        position:absolute;
        inset:0;

        background:linear-gradient(
            to top,
            rgba(0,0,0,0.85),
            rgba(0,0,0,0.15)
        );

        display:flex;
        flex-direction:column;
        justify-content:flex-end;

        padding:25px;
        color:white;
    }

    .album-overlay h2{
        color:white;
        margin-bottom:8px;
        font-size:1.6rem;
    }

    .album-overlay p{
        margin:0;
        color:#ddd;
    }

    /* =========================
       MODAL
    ========================== */

    .album-modal{
        display:none;
        position:fixed;
        z-index:9999;
        inset:0;
        background:rgba(0,0,0,0.94);
        overflow-y:auto;
        padding:60px;
    }

    .album-content{
        max-width:1300px;
        margin:auto;
    }

    .album-title{
        text-align:center;
        margin-bottom:40px;
    }

    .album-title h1{
        color:white;
    }

    .album-images{
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
        gap:20px;
    }

    .album-images img{
        width:100%;
        border-radius:10px;
        transition:0.4s ease;
        cursor:pointer;
    }

    .album-images img:hover{
        transform:scale(1.03);
    }

    .close-btn{
        position:fixed;
        top:20px;
        right:40px;
        color:white;
        font-size:50px;
        cursor:pointer;
        z-index:10000;
    }

    /* =========================
       LIGHTBOX
    ========================== */

    .lightbox{
        display:none;
        position:fixed;
        inset:0;
        background:rgba(0,0,0,0.96);
        z-index:20000;

        justify-content:center;
        align-items:center;
    }

    .lightbox img{
        max-width:90%;
        max-height:90%;
        border-radius:12px;
    }

    </style>

    <!-- =========================
         ALBUM GRID
    ========================== -->

    <div class="album-grid">

        <!-- MADRID -->
        <div class="album-card"
        onclick="openAlbum('madrid')">

            <img src="gallery/madrid/cover.jpg" alt="">

            <div class="album-overlay">
                <h2>Madrid</h2>
                <p>Conference & Spain memories</p>
            </div>

        </div>

        <!-- IIIT -->
        <div class="album-card"
        onclick="openAlbum('iiitv')">

            <img src="gallery/iiitv/cover.jpg" alt="">

            <div class="album-overlay">
                <h2>IIIT Varanasi</h2>
                <p>Campus & research life</p>
            </div>

        </div>

        <!-- RISHIKESH -->
        <div class="album-card"
        onclick="openAlbum('rishikesh')">

            <img src="gallery/4.jpg" alt="">

            <div class="album-overlay">
                <h2>Rishikesh</h2>
                <p>Travel & nature</p>
            </div>

        </div>

        <!-- ITALY -->
        <div class="album-card"
        onclick="openAlbum('italy')">

            <img src="gallery/5.jpg" alt="">

            <div class="album-overlay">
                <h2>Italy</h2>
                <p>International collaborations</p>
            </div>

        </div>

        <!-- LAB -->
        <div class="album-card"
        onclick="openAlbum('lab')">

            <img src="gallery/lab/cover.jpg" alt="">

            <div class="album-overlay">
                <h2>Lab Life</h2>
                <p>Research & coding moments</p>
            </div>

        </div>

    </div>

</section>

<!-- =========================
     ALBUM MODAL
========================= -->

<div id="albumModal" class="album-modal">

    <span class="close-btn"
    onclick="closeAlbum()">&times;</span>

    <div class="album-content">

        <div class="album-title">
            <h1 id="albumHeading"></h1>
        </div>

        <div id="albumImages"
        class="album-images"></div>

    </div>

</div>

<!-- =========================
     LIGHTBOX
========================= -->

<div id="lightbox" class="lightbox">

    <img id="lightboxImg">

</div>

<!-- =========================
     SCRIPT
========================= -->

<script>

const albums = {

    madrid: {
        title: "Madrid",
        images: [
            "gallery/1.jpg",
            "gallery/2.jpg",
            "gallery/3.jpg",
            "gallery/4.jpg"
        ]
    },

    iiitv: {
        title: "IIIT Varanasi",
        images: [
            "gallery/iiitv/1.jpg",
            "gallery/iiitv/2.jpg",
            "gallery/iiitv/3.jpg"
        ]
    },

    rishikesh: {
        title: "Rishikesh",
        images: [
            "gallery/rishikesh/1.jpg",
            "gallery/2.jpg",
            "gallery/rishikesh/3.jpg"
        ]
    },

    italy: {
        title: "Italy",
        images: [
            "gallery/italy/1.jpg",
            "gallery/italy/2.jpg",
            "gallery/italy/3.jpg"
        ]
    },

    lab: {
        title: "Lab Life",
        images: [
            "gallery/lab/1.jpg",
            "gallery/lab/2.jpg",
            "gallery/lab/3.jpg"
        ]
    }

};


/* =========================
   OPEN ALBUM
========================= */

function openAlbum(albumName){

    const modal =
    document.getElementById("albumModal");

    const albumImages =
    document.getElementById("albumImages");

    const heading =
    document.getElementById("albumHeading");

    albumImages.innerHTML = "";

    heading.innerText =
    albums[albumName].title;

    albums[albumName].images.forEach(image => {

        const img =
        document.createElement("img");

        img.src = image;

        /* LIGHTBOX */
        img.onclick = function(){

            document.getElementById("lightbox")
            .style.display = "flex";

            document.getElementById("lightboxImg")
            .src = image;

        }

        albumImages.appendChild(img);

    });

    modal.style.display = "block";

}


/* =========================
   CLOSE ALBUM
========================= */

function closeAlbum(){

    document.getElementById("albumModal")
    .style.display = "none";

}


/* =========================
   CLOSE LIGHTBOX
========================= */

document.getElementById("lightbox")
.onclick = function(){

    this.style.display = "none";

}


/* =========================
   CLOSE OUTSIDE CLICK
========================= */

window.onclick = function(event){

    const modal =
    document.getElementById("albumModal");

    if(event.target == modal){

        modal.style.display = "none";

    }

}

</script>
